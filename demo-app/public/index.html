<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outgoing Invoices — Acme Billing</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --success: #059669;
      --success-bg: #ecfdf5;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --warning: #d97706;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      --font: "Inter", system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, "SF Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: #0f172a;
      color: #e2e8f0;
      padding: 1.5rem 0;
    }

    .sidebar .brand {
      padding: 0 1.25rem 1.5rem;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 1rem;
    }

    .sidebar .brand h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }

    .sidebar .brand p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.15rem;
    }

    .nav-item {
      display: block;
      padding: 0.6rem 1.25rem;
      font-size: 0.85rem;
      color: #94a3b8;
      border-left: 3px solid transparent;
    }

    .nav-item.active {
      color: #fff;
      background: #1e293b;
      border-left-color: var(--accent);
    }

    .main {
      padding: 2rem 2.5rem;
      max-width: 960px;
    }

    .page-header {
      margin-bottom: 1.75rem;
    }

    .page-header h2 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .page-header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .invoice-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    .invoice-table th {
      text-align: left;
      padding: 0.75rem 1.25rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    .invoice-table td {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .invoice-table tr:last-child td { border-bottom: none; }

    .invoice-table tbody tr {
      cursor: pointer;
      transition: background 0.12s;
    }

    .invoice-table tbody tr:hover { background: #f8fafc; }
    .invoice-table tbody tr.selected { background: var(--accent-light); }

    .customer-cell .name { font-weight: 500; }
    .customer-cell .id { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); }

    .status-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
    }

    .status-badge.ready { background: var(--success-bg); color: var(--success); }
    .status-badge.pending { background: #fff7ed; color: var(--warning); }

    .amount { font-variant-numeric: tabular-nums; font-weight: 500; }
    .amount.muted { color: var(--muted); font-weight: 400; }

    .detail-panel {
      margin-top: 1.5rem;
      display: none;
    }

    .detail-panel.visible { display: block; }

    .detail-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .detail-header h3 { font-size: 1rem; font-weight: 600; }
    .detail-header .meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

    .line-items {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .line-items th {
      text-align: left;
      padding: 0.6rem 1.25rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    .line-items td {
      padding: 0.7rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .line-items tr:last-child td { border-bottom: none; }

    .discount-tag {
      font-size: 0.75rem;
      color: var(--success);
      background: var(--success-bg);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }

    .discount-tag.none { color: var(--muted); background: #f1f5f9; }

    .detail-footer {
      padding: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
    }

    .totals-preview {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .totals-preview strong {
      color: var(--text);
      font-size: 1.1rem;
      margin-left: 0.5rem;
    }

    button.generate {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.generate:hover { background: var(--accent-hover); }
    button.generate:disabled { opacity: 0.6; cursor: not-allowed; }

    button.generate svg { width: 16px; height: 16px; }

    /* Toasts */
    .toast-container {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-width: 380px;
    }

    .toast {
      padding: 0.9rem 1.1rem;
      border-radius: var(--radius);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      font-size: 0.85rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      animation: slideIn 0.25s ease;
      border: 1px solid transparent;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .toast.success { background: var(--success-bg); border-color: #a7f3d0; color: #065f46; }
    .toast.error { background: var(--error-bg); border-color: #fecaca; color: #991b1b; }
    .toast.info { background: var(--accent-light); border-color: #bfdbfe; color: #1e40af; }

    .toast .icon { font-size: 1.1rem; flex-shrink: 0; line-height: 1; }
    .toast .body strong { display: block; margin-bottom: 0.15rem; }
    .toast .body p { font-size: 0.8rem; opacity: 0.9; }

    /* Agent pipeline (collapsed by default, opens on incident) */
    .agent-drawer {
      position: fixed;
      bottom: 0;
      right: 1.5rem;
      width: min(920px, calc(100vw - 3rem));
      max-height: 78vh;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #1e293b;
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.35);
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 900;
      display: flex;
      flex-direction: column;
    }

    .agent-drawer.open { transform: translateY(0); }

    .agent-drawer-header {
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .agent-drawer-tabs {
      display: flex;
      gap: 0.35rem;
      padding: 0.5rem 1rem 0;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }

    .agent-tab {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.45rem 0.75rem;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-family: inherit;
    }

    .agent-tab.active {
      color: #e2e8f0;
      background: #1e293b;
    }

    .agent-drawer-body {
      padding: 1rem 1.1rem 1.25rem;
      overflow-y: auto;
      font-size: 0.82rem;
      font-family: var(--mono);
      flex: 1;
      min-height: 280px;
    }

    .agent-meta {
      color: #93c5fd;
      margin-bottom: 0.75rem;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .agent-meta a { color: #60a5fa; }

    .agent-log { color: #94a3b8; margin-bottom: 0.35rem; line-height: 1.45; }
    .agent-log.done { color: #34d399; }
    .agent-log.err { color: #f87171; }

    .stream-list { display: flex; flex-direction: column; gap: 0.65rem; }

    .stream-event {
      border: 1px solid #1e293b;
      border-radius: 8px;
      background: #111827;
      overflow: hidden;
    }

    .stream-event summary {
      cursor: pointer;
      padding: 0.55rem 0.75rem;
      list-style: none;
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
      font-size: 0.78rem;
    }

    .stream-event summary::-webkit-details-marker { display: none; }

    .stream-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .stream-badge.thinking { background: #4c1d95; color: #ddd6fe; }
    .stream-badge.assistant { background: #1e3a8a; color: #bfdbfe; }
    .stream-badge.tool_call { background: #713f12; color: #fde68a; }
    .stream-badge.user { background: #134e4a; color: #99f6e4; }
    .stream-badge.system { background: #334155; color: #cbd5e1; }
    .stream-badge.conversation { background: #831843; color: #fbcfe8; }
    .stream-badge.default { background: #334155; color: #cbd5e1; }

    .stream-event pre {
      margin: 0;
      padding: 0.75rem;
      border-top: 1px solid #1e293b;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.72rem;
      line-height: 1.5;
      max-height: 320px;
      overflow: auto;
      color: #cbd5e1;
    }

    .conversation-panel pre,
    .prompt-panel pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.76rem;
      line-height: 1.55;
      color: #cbd5e1;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.85rem;
      max-height: 52vh;
      overflow: auto;
    }

    .agent-drawer .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      display: inline-block;
      margin-right: 0.4rem;
    }

    .agent-drawer .status-dot.active { background: #fbbf24; animation: pulse 1s infinite; }
    .agent-drawer .status-dot.done { background: #34d399; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .panel-empty {
      color: #64748b;
      font-size: 0.8rem;
      line-height: 1.5;
      padding: 0.5rem 0;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>Acme Billing</h1>
        <p>Internal portal</p>
      </div>
      <span class="nav-item active">Outgoing invoices</span>
      <span class="nav-item">Customers</span>
      <span class="nav-item">Reports</span>
    </aside>

    <div class="main">
      <div class="page-header">
        <h2>Outgoing invoices</h2>
        <p>Generate and download invoices sent to customer accounts.</p>
      </div>

      <div class="card">
        <table class="invoice-table">
          <thead>
            <tr>
              <th>Invoice</th>
              <th>Customer</th>
              <th>Issued</th>
              <th>Due</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="invoice-list">
            <tr><td colspan="6" class="empty-state">Loading invoices…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="card detail-panel" id="detail-panel">
        <div class="detail-header">
          <div>
            <h3 id="detail-title">—</h3>
            <p class="meta" id="detail-meta">—</p>
          </div>
        </div>
        <table class="line-items">
          <thead>
            <tr>
              <th>SKU</th>
              <th>Description</th>
              <th>Qty</th>
              <th>Unit price</th>
              <th>Discount</th>
              <th>Line total</th>
            </tr>
          </thead>
          <tbody id="line-items-body"></tbody>
        </table>
        <div class="detail-footer">
          <div class="totals-preview" id="totals-preview"></div>
          <button class="generate" id="generate-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Generate &amp; download
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <div class="agent-drawer" id="agent-drawer">
    <div class="agent-drawer-header" id="agent-drawer-toggle">
      <span><span class="status-dot" id="agent-dot"></span>Incident pipeline</span>
      <span id="agent-drawer-label">—</span>
    </div>
    <div class="agent-drawer-tabs" id="agent-drawer-tabs">
      <button type="button" class="agent-tab active" data-tab="overview">Overview</button>
      <button type="button" class="agent-tab" data-tab="stream">Stream</button>
      <button type="button" class="agent-tab" data-tab="conversation">Conversation</button>
      <button type="button" class="agent-tab" data-tab="prompt">Prompt</button>
    </div>
    <div class="agent-drawer-body" id="agent-drawer-body"></div>
  </div>

  <script>
    const ORCHESTRATOR_URL = window.ORCHESTRATOR_URL || "http://localhost:3000";
    let selectedId = null;
    let selectedDetail = null;
    let lastError = null;
    let pollTimer = null;
    let activeIncidentId = null;
    let activeErrorFingerprint = null;
    let activeAgentTab = "overview";
    let latestIncidentRecord = null;

    function esc(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function formatJson(value) {
      try {
        return esc(JSON.stringify(value, null, 2));
      } catch {
        return esc(String(value));
      }
    }

    function eventSummary(ev) {
      return ev.summary ?? ev.message ?? ev.type ?? "event";
    }

    function eventPayload(ev) {
      if (ev.payload !== undefined) return ev.payload;
      if (ev.message && ev.type !== "prompt") {
        try { return JSON.parse(ev.message); } catch { return ev.message; }
      }
      return ev.summary ?? ev.message ?? ev;
    }

    function renderStreamEvents(events) {
      if (!events?.length) {
        return `<div class="panel-empty">No stream events yet. Live cloud runs populate this tab from <code>run.stream()</code>. DRY RUN shows the prompt on the Prompt tab.</div>`;
      }

      return `<div class="stream-list">${events.map((ev) => {
        const type = ev.type || "event";
        const badgeClass = ["thinking", "assistant", "tool_call", "user", "system", "conversation"].includes(type)
          ? type
          : "default";
        const ts = ev.ts?.split("T")[1]?.slice(0, 8) || "";
        const payload = eventPayload(ev);
        const body = typeof payload === "string" && type === "prompt"
          ? esc(payload)
          : formatJson(payload);
        return `<details class="stream-event" ${type === "thinking" || type === "tool_call" ? "open" : ""}>
          <summary>
            <span class="stream-badge ${badgeClass}">${esc(type)}</span>
            <span>[${ts}] ${esc(eventSummary(ev))}</span>
          </summary>
          <pre>${body}</pre>
        </details>`;
      }).join("")}</div>`;
    }

    function renderConversationPanel(remediation) {
      const conversation = remediation?.conversation;
      if (!conversation) {
        const fromEvent = remediation?.events?.find((e) => e.type === "conversation");
        if (fromEvent?.payload) {
          return `<div class="conversation-panel"><pre>${formatJson(fromEvent.payload)}</pre></div>`;
        }
        return `<div class="panel-empty">Conversation transcript appears after a live cloud run via <code>run.conversation()</code>.</div>`;
      }
      return `<div class="conversation-panel"><pre>${formatJson(conversation)}</pre></div>`;
    }

    function renderPromptPanel(remediation) {
      const prompt = remediation?.prompt;
      if (!prompt) {
        return `<div class="panel-empty">Prompt not generated yet.</div>`;
      }
      return `<div class="prompt-panel"><pre>${esc(prompt)}</pre></div>`;
    }

    function renderOverviewPanel(record) {
      const remediation = record.remediations?.[0];
      const logs = (record.logs || []).map((l) => {
        const cls = l.phase === "completed" ? "done" : l.phase === "error" ? "err" : "";
        const ts = l.ts.split("T")[1]?.slice(0, 8) || "";
        return `<div class="agent-log ${cls}">[${ts}] ${esc(l.message)}</div>`;
      }).join("");

      const links = [];
      if (remediation?.agentId) {
        links.push(`<a href="https://cursor.com/agents/${esc(remediation.agentId)}" target="_blank" rel="noopener">Open in Cursor ↗</a>`);
      }
      if (remediation?.runId) links.push(`run <code>${esc(remediation.runId)}</code>`);
      if (remediation?.prUrl) {
        links.push(`<a href="${esc(remediation.prUrl)}" target="_blank" rel="noopener">PR ↗</a>`);
      }

      const streamCount = remediation?.events?.filter((e) => !["prompt", "conversation"].includes(e.type)).length ?? 0;
      const turnCount = Array.isArray(remediation?.conversation) ? remediation.conversation.length : 0;

      return `
        <div class="agent-meta">
          <div><strong>${esc(record.plan?.strategy)}</strong> · ${esc(record.plan?.model)} · ${record.dryRun ? "DRY RUN" : "LIVE"}</div>
          <div>${links.join(" · ") || "Waiting for agent IDs…"}</div>
          <div>${streamCount} stream events · ${turnCount} conversation turns</div>
        </div>
        ${logs}
      `;
    }

    function renderAgentDrawer(record) {
      latestIncidentRecord = record;
      const dot = document.getElementById("agent-dot");
      const label = document.getElementById("agent-drawer-label");
      const body = document.getElementById("agent-drawer-body");
      const remediation = record.remediations?.[0];

      label.textContent = record.status;
      dot.classList.toggle("active", record.status === "remediating" || record.status === "received" || record.status === "triaged");
      dot.classList.toggle("done", record.status === "completed");

      document.querySelectorAll(".agent-tab").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === activeAgentTab);
      });

      let html = "";
      switch (activeAgentTab) {
        case "stream":
          html = renderStreamEvents(remediation?.events?.filter((e) => e.type !== "conversation"));
          break;
        case "conversation":
          html = renderConversationPanel(remediation);
          break;
        case "prompt":
          html = renderPromptPanel(remediation);
          break;
        default:
          html = renderOverviewPanel(record);
      }
      body.innerHTML = html;
    }

    function openAgentDrawer() {
      document.getElementById("agent-drawer").classList.add("open");
      document.getElementById("agent-dot").classList.add("active");
    }

    const fmt = (cents) =>
      new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(cents / 100);

    const fmtDate = (iso) =>
      new Date(iso + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

    function showToast(type, title, message) {
      const container = document.getElementById("toasts");
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      const icons = { success: "✓", error: "✕", info: "ℹ" };
      el.innerHTML = `<span class="icon">${icons[type] || "·"}</span><div class="body"><strong>${title}</strong><p>${message}</p></div>`;
      container.appendChild(el);
      setTimeout(() => el.remove(), type === "error" ? 8000 : 5000);
    }

    async function loadInvoiceList() {
      const res = await fetch("/api/invoices");
      const list = await res.json();
      const tbody = document.getElementById("invoice-list");

      tbody.innerHTML = list.map((inv) => `
        <tr data-id="${inv.id}" class="${selectedId === inv.id ? "selected" : ""}">
          <td><span class="customer-cell"><span class="name">${inv.id}</span></span></td>
          <td><span class="customer-cell"><span class="name">${inv.customer}</span></span></td>
          <td>${fmtDate(inv.issuedAt)}</td>
          <td>${fmtDate(inv.dueDate)}</td>
          <td class="amount ${inv.totalCents == null ? "muted" : ""}">${inv.totalCents != null ? fmt(inv.totalCents) : "—"}</td>
          <td><span class="status-badge ${inv.status}">${inv.status === "ready" ? "Ready" : "Pending"}</span></td>
        </tr>
      `).join("");

      tbody.querySelectorAll("tr[data-id]").forEach((row) => {
        row.addEventListener("click", () => selectInvoice(row.dataset.id));
      });
    }

    async function selectInvoice(id) {
      selectedId = id;
      await loadInvoiceList();

      const res = await fetch(`/api/invoices/${id}`);
      if (!res.ok) return;
      selectedDetail = await res.json();

      document.getElementById("detail-panel").classList.add("visible");
      document.getElementById("detail-title").textContent = `${selectedDetail.id} — ${selectedDetail.customer}`;
      document.getElementById("detail-meta").textContent = `Currency: ${selectedDetail.currency}`;

      const tbody = document.getElementById("line-items-body");
      tbody.innerHTML = selectedDetail.lineItems.map((item) => {
        const gross = item.unitPriceCents * item.quantity;
        const discPct = item.discount ? `${(item.discount.rate * 100).toFixed(0)}%` : null;
        const discTag = item.discount
          ? `<span class="discount-tag">${discPct} — ${item.discount.reason}</span>`
          : `<span class="discount-tag none">None</span>`;
        return `
          <tr>
            <td style="font-family:var(--mono);font-size:0.8rem">${item.sku}</td>
            <td>${item.description}</td>
            <td>${item.quantity}</td>
            <td class="amount">${fmt(item.unitPriceCents)}</td>
            <td>${discTag}</td>
            <td class="amount">${fmt(gross)}</td>
          </tr>
        `;
      }).join("");

      document.getElementById("totals-preview").innerHTML = "Total will be calculated on generate";
    }

    function downloadInvoice(summary, customer) {
      const content = [
        `INVOICE ${summary.invoiceId}`,
        `Customer: ${customer}`,
        `Currency: ${summary.currency}`,
        ``,
        `Subtotal:  ${fmt(summary.subtotalCents)}`,
        `Discount:  ${fmt(summary.discountCents)}`,
        `Total:     ${fmt(summary.totalCents)}`,
        ``,
        `Generated: ${new Date().toISOString()}`,
      ].join("\n");

      const blob = new Blob([content], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${summary.invoiceId}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function pollIncident(id) {
      try {
        const res = await fetch(`${ORCHESTRATOR_URL}/api/incidents/${id}`);
        if (!res.ok) return;
        const record = await res.json();
        renderAgentDrawer(record);
        if (record.status === "completed" || record.status === "error") {
          clearInterval(pollTimer);
          pollTimer = null;
          showToast("info", "Remediation pipeline complete",
            record.dryRun ? "Dry run finished — prompt logged, no cloud agent started." : "Cloud agent finished.");
        }
      } catch { /* orchestrator offline */ }
    }

    function errorFingerprint(err) {
      return [err.service ?? "", err.message ?? "", err.culprit ?? "", err.stack ?? ""].join("\n");
    }

    async function fireAgent() {
      if (!lastError) return;
      openAgentDrawer();

      const fingerprint = errorFingerprint(lastError);
      if (activeErrorFingerprint === fingerprint && activeIncidentId) {
        if (!pollTimer) pollTimer = setInterval(() => pollIncident(activeIncidentId), 800);
        void pollIncident(activeIncidentId);
        return;
      }

      try {
        const res = await fetch(`${ORCHESTRATOR_URL}/api/trigger-from-error`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(lastError),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        activeErrorFingerprint = fingerprint;
        activeIncidentId = data.incident;

        if (data.duplicate) {
          void pollIncident(data.incident);
          if (!pollTimer) pollTimer = setInterval(() => pollIncident(data.incident), 800);
          return;
        }

        renderAgentDrawer({
          status: "received",
          plan: data.plan,
          dryRun: data.dryRun,
          logs: [{ ts: new Date().toISOString(), phase: "received", message: "Incident auto-triggered from invoice generation failure" }],
          remediations: [],
        });

        pollTimer = setInterval(() => pollIncident(data.incident), 800);
        pollIncident(data.incident);
      } catch {
        showToast("info", "Orchestrator offline", "Run npm run orchestrator to see the remediation pipeline.");
      }
    }

    async function generateInvoice() {
      if (!selectedId) return;
      const btn = document.getElementById("generate-btn");
      btn.disabled = true;
      btn.textContent = "Generating…";

      showToast("info", "Generating invoice", `Building ${selectedId} for download…`);

      try {
        const res = await fetch(`/api/invoices/${selectedId}/summary`);
        const data = await res.json();

        if (res.ok) {
          downloadInvoice(data, selectedDetail.customer);
          document.getElementById("totals-preview").innerHTML =
            `Total<strong>${fmt(data.totalCents)}</strong> <span style="color:var(--success);margin-left:0.5rem">(inc. ${fmt(data.discountCents)} discount)</span>`;
          showToast("success", "Invoice downloaded", `${selectedId} for ${selectedDetail.customer} saved successfully.`);
        } else if (res.status === 500) {
          lastError = data;
          showToast("error", "Failed to generate invoice",
            `Server error: ${data.message}. The billing team has been notified.`);
          void fireAgent();
        } else {
          showToast("error", "Generation failed", data.error || "Unknown error");
        }
      } catch (err) {
        showToast("error", "Network error", err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Generate &amp; download`;
      }
    }

    document.getElementById("generate-btn").addEventListener("click", generateInvoice);
    document.getElementById("agent-drawer-toggle").addEventListener("click", () => {
      document.getElementById("agent-drawer").classList.toggle("open");
    });

    document.getElementById("agent-drawer-tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".agent-tab");
      if (!btn) return;
      e.stopPropagation();
      activeAgentTab = btn.dataset.tab;
      if (latestIncidentRecord) renderAgentDrawer(latestIncidentRecord);
    });

    loadInvoiceList().then(() => selectInvoice("INV-1001"));
  </script>
</body>
</html>
